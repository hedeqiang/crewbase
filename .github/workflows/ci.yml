name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web

  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The bubblewrap sandbox tests run inside real bwrap when it is
      # installed and can create namespaces; they skip otherwise, so a
      # failed install never fails the build. Ubuntu 24.04 lets only
      # AppArmor-profiled programs use unprivileged user namespaces; the
      # throwaway runner lifts that restriction.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y -q bubblewrap || (sudo apt-get update -q && sudo apt-get install -y -q bubblewrap)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net -- /bin/true && echo "bwrap works"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Cross-compile for Windows
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 go build ./...
