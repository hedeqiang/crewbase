# Release: push a tag v<version> matching apps/desktop/mygo.json.
#
#   1. bump "version" in apps/desktop/mygo.json, add a "## <version>"
#      section to CHANGELOG.md, commit
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# The draft release gets the desktop apps (macOS .dmg, Windows installer,
# Linux .deb / .rpm / .tar.gz) with signed auto-updates, and the crewd /
# crew / crew-relay archives; the server image goes to ghcr.io. The release
# is published once every job uploaded, and installed apps update to it.
#
# macOS apps are signed ad hoc until a Developer ID is configured
# (docs/release.md): on other Macs, the first launch needs right-click →
# Open, or `xattr -dr com.apple.quarantine /Applications/Crewbase.app`.
# Updates are signed with MYGO_UPDATER_PRIVATE_KEY either way.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version apps/desktop/mygo.json)"
      - name: Check the changelog
        run: grep -qE "^## \[?${GITHUB_REF_NAME#v}\]?( |$)" CHANGELOG.md
      - name: Check the update key
        env:
          KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: test -n "$KEY" || { echo "::error::set the MYGO_UPDATER_PRIVATE_KEY secret (docs/release.md)"; exit 1; }
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # release notes: the version's CHANGELOG section, then how to install
          awk -v v="$v" '
            $0 ~ "^## \\[?" v "\\]?( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ## 安装

          **macOS**（推荐，无需处理 Gatekeeper）：

          ```sh
          curl -fsSL https://github.com/hedeqiang/crewbase/releases/latest/download/install.sh | sh
          ```

          也可以下载 `crewbase-<版本>.dmg`（通用版，Apple 芯片与 Intel 都原生运行）；应用暂未经 Apple 公证，首次打开需在「系统设置 › 隐私与安全性」点「仍要打开」。

          **Windows**：下载 `crewbase-setup-*.exe`（未签名，SmartScreen 选「更多信息 → 仍要运行」）。
          **Linux**：同上 `install.sh`，或 `.deb` / `.rpm`。
          **服务端**：`docker pull ghcr.io/hedeqiang/crewbase`；命令行压缩包见下方附件。

          已安装的客户端会自动更新。
          NOTES
          sed -i 's/^          //' notes.md
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Crewbase $GITHUB_REF_NAME" --notes-file notes.md $prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi

  desktop:
    needs: draft-release
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # one universal app (Apple Silicon + Intel): no wrong download to pick
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Build the web UI
        working-directory: apps/web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          CGO_ENABLED: "0"
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload apps/desktop

  binaries:
    needs: draft-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Build the web UI
        working-directory: apps/web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build crewd, crew and crew-relay
        env:
          CGO_ENABLED: "0"
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            # not crewbase-<v>-<os>-<arch>: that name is the desktop app's signed update archive
            dir="crewbase-cli-$v-$os-$arch"
            mkdir -p "out/$dir"
            for app in crewd:apps/crewd crew:apps/cli crew-relay:apps/relayd; do
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "out/$dir/${app%%:*}$ext" "./${app#*:}"
            done
            cp LICENSE THIRD_PARTY_NOTICES.txt "out/$dir/"
            if [ "$os" = windows ]; then
              (cd out && zip -qr "$dir.zip" "$dir")
            else
              tar -C out -czf "out/$dir.tar.gz" "$dir"
            fi
          done
          (cd out && sha256sum crewbase-cli-*.tar.gz crewbase-cli-*.zip > crewbase-cli-$v-checksums.txt)
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber out/crewbase-cli-*.tar.gz out/crewbase-cli-*.zip out/crewbase-cli-*-checksums.txt

  image:
    needs: draft-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          v="${GITHUB_REF_NAME#v}"
          tags="$repo:$v"
          chromium="$repo:$v-chromium"
          case "$v" in *-*) ;; *) tags="$tags,$repo:latest"; chromium="$chromium,$repo:chromium" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "chromium=$chromium" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: RUNTIME=chromium
          tags: ${{ steps.tags.outputs.chromium }}

  publish:
    needs: [desktop, binaries, image]
    runs-on: ubuntu-latest
    steps:
      - name: Check the update archives
        env:
          GH_TOKEN: ${{ github.token }}
        # every manifest's archive must be the file it signed (an asset
        # overwritten after the desktop build would break updates)
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[]|.name+" "+(.size|tostring)' > assets.txt
          mkdir m && gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'update-*.json' --dir m
          n=0
          for f in m/update-*.json; do
            name="$(jq -r .url "$f" | sed 's#.*/##')"; size="$(jq -r .size "$f")"
            grep -qx "$name $size" assets.txt || { echo "::error::$name does not match $(basename "$f") (size $size)"; exit 1; }
            n=$((n+1))
          done
          test "$n" -ge 5 # darwin-universal, linux ×2, windows ×2
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
