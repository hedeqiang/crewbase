name: 功能建议 / Feature request
description: 想要的新功能或改进 / Something new, or a change you would like
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / The problem
      description: 你在做什么时遇到了不便 / What you were trying to do, and what got in the way
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎么做 / What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的变通方式 / How you work around it today
